name: "Deploy"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Run unit tests
        run: uv run pytest

      - name: Set API version
        run: |
          export API_VERSION="$(uv version --short)-${GITHUB_SHA::7}"
          # Use the API directly until the CLI supports deploy-token auth for env commands:
          # https://github.com/fastapilabs/fastapi-cloud-cli/issues/312
          curl --fail-with-body \
            --request POST \
            --url "https://api.fastapicloud.com/api/v1/apps/${FASTAPI_CLOUD_APP_ID}/environment-variables/" \
            --header "Authorization: Bearer ${FASTAPI_CLOUD_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"API_VERSION\",\"value\":\"${API_VERSION}\",\"is_secret\":false}"
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      - name: Deploy to FastAPI Cloud
        run: uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
