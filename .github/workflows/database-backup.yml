name: Database Backup

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted public data dump
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Create encrypted monthly backup
        run: scripts/create-database-backup.sh monthly backups/monthly

      - name: Upload encrypted monthly backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-monthly-backup-${{ github.run_id }}
          path: backups/monthly/*
          retention-days: 90
          if-no-files-found: error
